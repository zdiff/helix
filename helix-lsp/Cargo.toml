[package]
name = "helix-lsp"
description = "LSP client implementation for Helix project"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
helix-stdx = { path = "../helix-stdx" }
helix-core = { path = "../helix-core" }
helix-loader = { path = "../helix-loader" }
helix-lsp-types = { path = "../helix-lsp-types" }

anyhow = { default-features = false, version = "1.0" }
futures-executor.workspace = true
futures-util.workspace = true
globset.workspace = true
log = "0.4"
serde = { version = "1.0", default-features = false }
serde_json = { default-features = false, version = "1.0" }
tokio = { version = "1.50", features = ["process", "io-util", "macros", "rt"], default-features = false }
tokio-stream.workspace = true
parking_lot.workspace = true
arc-swap = "1"
slotmap.workspace = true
thiserror.workspace = true
sonic-rs.workspace = true
