[package]
name = "helix-core"
description = "Helix editor core editing primitives"
include = ["src/**/*", "README.md"]
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
unicode-lines = ["ropey/unicode_lines"]
integration = []

[dependencies]
helix-stdx = { path = "../helix-stdx" }
helix-loader = { path = "../helix-loader" }
helix-parsec = { path = "../helix-parsec" }

ropey.workspace = true
smallvec = "1.15"
smartstring = { default-features = false, version = "1.0.1" }
unicode-segmentation.workspace = true
# unicode-width is changing width definitions
# that both break our logic and disagree with common
# width definitions in terminals, we need to replace it.
# For now lets lock the version to avoid rendering glitches
# when installing without `--locked`
unicode-width = { default-features = false, version = "=0.1.12" }
unicode-general-category = "1.1"
slotmap.workspace = true
tree-house.workspace = true
once_cell = { default-features = false, version = "1.21" }
arc-swap = "1"
regex = { default-features = false, version = "1" }
bitflags.workspace = true
foldhash.workspace = true

log = "0.4"
anyhow = { default-features = false, version = "1.0" }
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
toml.workspace = true

imara-diff = { default-features = false, version = "0.2.0" }
encoding_rs = { default-features = false, version = "0.8" }

chrono = { version = "0.4", default-features = false, features = ["alloc"] }

textwrap = { default-features = false, version = "0.16.2" }

nucleo.workspace = true
parking_lot.workspace = true
globset.workspace = true
regex-cursor = { default-features = false, version = "0.1.5" }

[dev-dependencies]
quickcheck.workspace = true
indoc = "2.0.6"
